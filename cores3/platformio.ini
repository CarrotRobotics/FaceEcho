; FaceEcho 伙伴 · M5Stack CoreS3 固件
; 刷机：  pip install platformio   然后在本目录  pio run -t upload
; 看日志：pio device monitor
[env:cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0
